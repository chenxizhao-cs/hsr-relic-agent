[package]
name = "hsr-agent-runtime"
version = "0.3.0"
edition = "2024"

[dependencies]
hsr-relic-agent = { path = "../hsr-relic-agent" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }
url = "2"
